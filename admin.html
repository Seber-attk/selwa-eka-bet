<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — ሒልዋ ዕቃ ቤት</title>
<style>
:root{--g:#245c45;--gd:#183f30;--c:#f7f4ed;--w:#fffdf8;--i:#17211b;--m:#68756d;--l:#e7e1d5;--gold:#d6a84f;--danger:#9c352f}
*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font-family:"Noto Sans Ethiopic",Arial,sans-serif;line-height:1.7}
.wrap{width:min(980px,92%);margin:auto}header{background:#f7f4edf2;border-bottom:1px solid var(--l);position:sticky;top:0;z-index:10}
.nav{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit}.logo{width:40px;height:40px;border-radius:12px;background:var(--g);color:#fff;display:grid;place-items:center}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--g);color:#fff;font-weight:800;cursor:pointer}.btn:hover{background:var(--gd)}.alt{background:#fff;color:var(--i);border:1px solid var(--l)}.danger{background:var(--danger)}.danger:hover{background:#7f2925}
main{padding:45px 0 70px}.card{background:var(--w);border:1px solid var(--l);border-radius:24px;padding:25px;margin-bottom:18px;box-shadow:0 14px 40px #183f3010}
h1{margin:5px 0 8px;font-size:clamp(30px,6vw,48px);line-height:1.1}h2{margin-top:0}.muted{color:var(--m)}.tag{display:inline-block;color:var(--g);background:#e7f0eb;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:850}
.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.wide{grid-column:1/-1}label{font-weight:750;font-size:14px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--l);border-radius:11px;background:#fff;font:inherit;margin-top:5px}textarea{min-height:100px;resize:vertical}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.status{margin-top:12px;font-size:14px;color:var(--m)}
#loginView{max-width:500px;margin:55px auto}.error{color:var(--danger);font-weight:700}.success{color:var(--g);font-weight:700}
.productList{display:grid;gap:12px}.product{display:grid;grid-template-columns:90px 1fr auto;gap:15px;align-items:center;border:1px solid var(--l);padding:12px;border-radius:16px;background:#fff}
.thumb{width:90px;height:75px;border-radius:12px;overflow:hidden;background:linear-gradient(145deg,#edf2ed,#f5ead0);display:grid;place-items:center;font-size:35px}.thumb img{width:100%;height:100%;object-fit:cover}
.product h3{margin:0 0 3px;font-size:17px}.product small{color:var(--m)}.topbar{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}
.hidden{display:none!important}
.note{background:#fff7df;border:1px solid #ead9a9;padding:12px 14px;border-radius:14px;color:#66551f;margin:16px 0}
@media(max-width:700px){.form{grid-template-columns:1fr}.wide{grid-column:auto}.product{grid-template-columns:65px 1fr}.product .actions{grid-column:1/-1}.thumb{width:65px;height:65px}}
</style>
</head>
<body>
<header><div class="wrap nav">
<a class="brand" href="index.html"><span class="logo">ሒ</span>ሒልዋ ዕቃ ቤት</a>
<button class="btn alt" id="logoutBtn" style="display:none">ውጣ</button>
</div></header>

<main class="wrap">
<section id="loginView" class="card">
<span class="tag">አስተዳዳሪ</span>
<h1>የሱቅ መግቢያ</h1>
<p class="muted">ይህ ገጽ ለሒልዋ ዕቃ ቤት አስተዳዳሪ ብቻ ነው።</p>
<form id="loginForm">
<label>ኢሜይል<input id="email" type="email" autocomplete="username" required></label>
<label>የይለፍ ቃል<input id="password" type="password" autocomplete="current-password" required></label>
<div class="actions"><button class="btn" type="submit">ግባ</button><a class="btn alt" href="index.html">ወደ ድረ-ገጹ</a></div>
<div id="loginStatus" class="status"></div>
</form>
</section>

<section id="adminView" class="hidden">
<div class="card">
<div class="topbar"><div><span class="tag">የሱቅ አስተዳደር</span><h1>ዕቃዎችን ያስተዳድሩ</h1><p class="muted">ምርት ይጨምሩ፣ ዋጋ ይቀይሩ ወይም ዕቃ ያስወግዱ።</p></div><span id="who" class="muted"></span></div>
<div class="note">🖼️ ፎቶ ከስልክዎ ወይም ኮምፒውተርዎ በቀጥታ ይምረጡ — ራሱ በራሱ ይጨመቃል፣ ምንም ሊንክ መፈለግ አያስፈልግም። (ወይም ካለዎት image URL መለጠፍ ይችላሉ)</div>
<form id="productForm" class="form">
<label>የዕቃ ስም<input id="name" required placeholder="ለምሳሌ ባለ 3 ክፍል ምሳ ሳጥን"></label>
<label>ምድብ<select id="category"><option>የምሳ ሳጥኖች</option><option>የወጥ ቤት ዕቃዎች</option><option>የቤት ዕቃዎች</option></select></label>
<label>ዋጋ<input id="price" required placeholder="450 ብር"></label>
<label class="wide">ፎቶ ይምረጡ
  <input id="imageFile" type="file" accept="image/*">
  <div id="imgPreviewWrap" style="display:none;margin-top:10px;display:flex;align-items:center;gap:12px">
    <img id="imgPreview" style="width:80px;height:65px;object-fit:cover;border-radius:10px;border:1px solid var(--l)">
    <button type="button" class="btn alt" id="clearImgBtn" style="padding:8px 12px">ፎቶ አስወግድ</button>
  </div>
  <div id="imgStatus" class="status"></div>
</label>
<label class="wide">ወይም የፎቶ ሊንክ (አማራጭ)<input id="imageUrl" type="url" placeholder="https://..."></label>
<label class="wide">መግለጫ<textarea id="description" placeholder="ስለ ዕቃው አጭር መግለጫ"></textarea></label>
<div class="actions wide"><button class="btn" type="submit" id="saveBtn">+ ዕቃ ጨምር</button><button class="btn alt" type="button" id="cancelBtn" style="display:none">መሰረዝ</button></div>
<div id="formStatus" class="status wide"></div>
</form>
</div>

<div class="card">
<div class="topbar"><h2>የአሁኑ ዕቃዎች</h2><button class="btn alt" id="refreshBtn">እንደገና ጫን</button></div>
<div id="productList" class="productList"><p class="muted">በመጫን ላይ…</p></div>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {
  getFirestore, collection, addDoc, getDocs, query, orderBy,
  doc, updateDoc, deleteDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD32BBY02WjS-8WsujDUSkh_RZcxOteGLs",
  authDomain: "esmael-eka-bet.firebaseapp.com",
  projectId: "esmael-eka-bet",
  storageBucket: "esmael-eka-bet.firebasestorage.app",
  messagingSenderId: "672016286578",
  appId: "1:672016286578:web:395921ad75474ae1fd53eb"
};

// CHANGE THIS to the exact email of the admin account you created in Firebase Authentication.
const ADMIN_EMAIL = "mohammedseidmusteffa@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginView = document.getElementById("loginView");
const adminView = document.getElementById("adminView");
const logoutBtn = document.getElementById("logoutBtn");
const loginForm = document.getElementById("loginForm");
const loginStatus = document.getElementById("loginStatus");
const form = document.getElementById("productForm");
const formStatus = document.getElementById("formStatus");
const productList = document.getElementById("productList");
const saveBtn = document.getElementById("saveBtn");
const cancelBtn = document.getElementById("cancelBtn");
const who = document.getElementById("who");

let editingId = null;
let pendingImageData = null; // null = untouched, "" = explicitly cleared, string = new data URL
let currentImageUrl = "";

const imageFile = document.getElementById("imageFile");
const imgPreview = document.getElementById("imgPreview");
const imgPreviewWrap = document.getElementById("imgPreviewWrap");
const imgStatus = document.getElementById("imgStatus");
const clearImgBtn = document.getElementById("clearImgBtn");

function fileToCompressedDataURL(file, maxDim = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function withTimeout(promise, ms, message) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => {
      const e = new Error(message);
      e.isTimeout = true;
      reject(e);
    }, ms))
  ]);
}

function classifyError(err) {
  if (err && err.isTimeout) {
    return { icon: "🌐", text: "Firebase ጋር በ10 ሰከንድ ውስጥ መገናኘት አልተቻለም። ኢንተርኔትዎ ወይም ፋየርዎል ችግር ሊሆን ይችላል።" };
  }
  const code = err && err.code;
  if (code === "permission-denied") {
    return { icon: "🔐", text: "ፍቃድ ተከልክሏል፦ Firestore Rules ይህን አልፈቀዱም። (ADMIN_EMAIL እና Rules ውስጥ ያለው ኢሜይል ተመሳሳይ መሆኑን፣ Rules Publish መደረጉን ያረጋግጡ)" };
  }
  if (code === "unavailable" || code === "deadline-exceeded") {
    return { icon: "🌐", text: "ከ Firestore ጋር መገናኘት አልተቻለም። ኢንተርኔትዎን ያረጋግጡ።" };
  }
  return { icon: "❌", text: (code ? `[${code}] ` : "") + (err && err.message ? err.message : "ያልታወቀ ስህተት ተፈጥሯል።") };
}

function isHeic(file) {
  const type = (file.type || "").toLowerCase();
  return type === "image/heic" || type === "image/heif" || /\.hei[cf]$/i.test(file.name || "");
}

async function normalizeToStandardImage(file) {
  if (!isHeic(file)) return file;
  if (typeof window.heic2any !== "function") {
    throw new Error("ይህ ፎቶ አይነት (HEIC) ማንበብ የሚያስችል ክፍል አልጫነም። ሌላ ፎቶ ይሞክሩ።");
  }
  const converted = await window.heic2any({ blob: file, toType: "image/jpeg", quality: 0.85 });
  return Array.isArray(converted) ? converted[0] : converted;
}

imageFile.addEventListener("change", async () => {
  const file = imageFile.files[0];
  if (!file) return;
  imgStatus.textContent = "ፎቶ በማዘጋጀት ላይ…";
  imgStatus.className = "status";
  try {
    const normalized = await withTimeout(
      normalizeToStandardImage(file),
      15000,
      "ፎቶውን መቀየር ጊዜው አልፎበታል። ሌላ ፎቶ ይሞክሩ።"
    );
    let dataUrl = await withTimeout(
      fileToCompressedDataURL(normalized),
      10000,
      "ፎቶውን ማዘጋጀት ጊዜው አልፎበታል። ሌላ ፎቶ ይሞክሩ ወይም ስክሪንሾት አድርገው ይላኩ።"
    );
    if (dataUrl.length > 700000) {
      dataUrl = await withTimeout(
        fileToCompressedDataURL(normalized, 650, 0.6),
        10000,
        "ፎቶውን ማዘጋጀት ጊዜው አልፎበታል። ሌላ ፎቶ ይሞክሩ።"
      );
    }
    pendingImageData = dataUrl;
    imgPreview.src = pendingImageData;
    imgPreviewWrap.style.display = "flex";
    imgStatus.textContent = "ፎቶ ተዘጋጅቷል ✓";
    imgStatus.className = "status success";
  } catch (err) {
    console.error(err);
    imgStatus.textContent = err.message || "ፎቶውን ማዘጋጀት አልተቻለም። እባክዎ ሌላ ፎቶ ይሞክሩ ወይም ስክሪንሾት አድርገው ይላኩ።";
    imgStatus.className = "status error";
  }
});

clearImgBtn.addEventListener("click", () => {
  pendingImageData = "";
  imageFile.value = "";
  imageUrl.value = "";
  imgPreviewWrap.style.display = "none";
  imgStatus.textContent = "";
});

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function isAdmin(user) {
  return user && user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
}

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  loginStatus.textContent = "በመግባት ላይ…";
  loginStatus.className = "status";
  try {
    const cred = await signInWithEmailAndPassword(auth, email.value.trim(), password.value);
    if (!isAdmin(cred.user)) {
      await signOut(auth);
      throw new Error("ይህ ኢሜይል የአስተዳዳሪ ኢሜይል አይደለም።");
    }
    loginStatus.textContent = "";
    loginForm.reset();
  } catch (err) {
    console.error(err);
    loginStatus.textContent = err.message || "መግባት አልተቻለም።";
    loginStatus.className = "status error";
  }
});

logoutBtn.addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, async (user) => {
  if (user && isAdmin(user)) {
    loginView.classList.add("hidden");
    adminView.classList.remove("hidden");
    logoutBtn.style.display = "";
    who.textContent = user.email;
    await loadProducts();
  } else {
    loginView.classList.remove("hidden");
    adminView.classList.add("hidden");
    logoutBtn.style.display = "none";
  }
});

async function loadProducts() {
  productList.innerHTML = "<p class='muted'>በመጫን ላይ…</p>";
  try {
    const snap = await getDocs(query(collection(db, "products"), orderBy("createdAt", "desc")));
    const products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!products.length) {
      productList.innerHTML = "<p class='muted'>እስካሁን ዕቃ የለም። ከላይ ይጨምሩ።</p>";
      return;
    }
    productList.innerHTML = products.map(p => `
      <div class="product">
        <div class="thumb">${p.imageUrl ? `<img src="${esc(p.imageUrl)}" alt="${esc(p.name)}">` : (p.icon || "🛍️")}</div>
        <div>
          <h3>${esc(p.name)}</h3>
          <small>${esc(p.category)} • ${esc(p.price || "ዋጋ ይጠይቁ")}</small>
          <div class="muted">${esc(p.description || "")}</div>
        </div>
        <div class="actions">
          <button class="btn alt" onclick="editProduct('${p.id}')">አርትዕ</button>
          <button class="btn danger" onclick="removeProduct('${p.id}')">ሰርዝ</button>
        </div>
      </div>`).join("");
  } catch (err) {
    console.error(err);
    productList.innerHTML = "<p class='error'>ዕቃዎችን መጫን አልተቻለም። Firestore Rules እና ADMIN_EMAIL ያረጋግጡ።</p>";
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  formStatus.textContent = "⏳ በማስቀመጥ ላይ (እስከ 10 ሰከንድ ይጠብቁ)…";
  formStatus.className = "status";
  let finalImage;
  if (pendingImageData !== null) finalImage = pendingImageData;
  else if (imageUrl.value.trim()) finalImage = imageUrl.value.trim();
  else if (editingId) finalImage = currentImageUrl;
  else finalImage = "";

  const data = {
    name: name.value.trim(),
    category: category.value,
    price: price.value.trim(),
    imageUrl: finalImage,
    description: description.value.trim(),
    icon: "🛍️"
  };
  if (!data.name || !data.price) {
    formStatus.textContent = "❌ የዕቃ ስም እና ዋጋ ያስገቡ።";
    formStatus.className = "status error";
    return;
  }
  try {
    if (editingId) {
      await withTimeout(
        updateDoc(doc(db, "products", editingId), {...data, updatedAt: serverTimestamp()}),
        10000,
        "ጊዜው አልፎበታል"
      );
      formStatus.textContent = "✅ ዕቃው ተሻሽሏል።";
    } else {
      await withTimeout(
        addDoc(collection(db, "products"), {...data, createdAt: serverTimestamp(), updatedAt: serverTimestamp()}),
        10000,
        "ጊዜው አልፎበታል"
      );
      formStatus.textContent = "✅ ዕቃው ተጨምሯል።";
    }
    formStatus.className = "status success";
    resetForm();
    await loadProducts();
  } catch (err) {
    console.error(err);
    const { icon, text } = classifyError(err);
    formStatus.textContent = `${icon} ${text}`;
    formStatus.className = "status error";
  }
});

window.editProduct = async function(id) {
  try {
    const snap = await getDocs(collection(db, "products"));
    const p = snap.docs.find(d => d.id === id);
    if (!p) return;
    const data = p.data();
    editingId = id;
    name.value = data.name || "";
    category.value = data.category || "የምሳ ሳጥኖች";
    price.value = data.price || "";
    description.value = data.description || "";
    pendingImageData = null;
    currentImageUrl = data.imageUrl || "";
    imageFile.value = "";
    if (currentImageUrl) {
      imgPreview.src = currentImageUrl;
      imgPreviewWrap.style.display = "flex";
      imageUrl.value = currentImageUrl.startsWith("data:") ? "" : currentImageUrl;
    } else {
      imgPreviewWrap.style.display = "none";
      imageUrl.value = "";
    }
    imgStatus.textContent = "";
    saveBtn.textContent = "ዕቃውን አዘምን";
    cancelBtn.style.display = "";
    window.scrollTo({top: 0, behavior: "smooth"});
  } catch (err) {
    alert("ዕቃውን ማስተካከል አልተቻለም።");
  }
};

window.removeProduct = async function(id) {
  if (!confirm("ይህን ዕቃ ማስወገድ ይፈልጋሉ?")) return;
  try {
    await deleteDoc(doc(db, "products", id));
    await loadProducts();
  } catch (err) {
    alert(err.message || "ዕቃውን ማስወገድ አልተቻለም።");
  }
};

cancelBtn.addEventListener("click", resetForm);
refreshBtn.addEventListener("click", loadProducts);

function resetForm() {
  editingId = null;
  form.reset();
  category.value = "የምሳ ሳጥኖች";
  saveBtn.textContent = "+ ዕቃ ጨምር";
  cancelBtn.style.display = "none";
  pendingImageData = null;
  currentImageUrl = "";
  imgPreviewWrap.style.display = "none";
  imgStatus.textContent = "";
}
</script>
</body>
</html>
